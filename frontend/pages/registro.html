<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Tienda Deportiva</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="container">

        <h1>Registro</h1>

        <form id="registroForm"
             action="../../backend/basededatos/guardar_cliente.php"
              method="POST">

            <div class="form-row">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="tipoDocumento">
                        Tipo de Documento
                    </label>

                    <select
                        id="tipoDocumento"
                        name="tipo_documento"
                        required
                    >

                        <option value="">
                            Seleccione
                        </option>

                        <option value="CC">
                            Cédula de ciudadanía
                        </option>

                        <option value="TI">
                            Tarjeta de identidad
                        </option>

                        <option value="CE">
                            Cédula de extranjería
                        </option>

                        <option value="Pasaporte">
                            Pasaporte
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="numeroDocumento">
                        Número de Documento
                    </label>

                    <input
                        type="text"
                        id="numeroDocumento"
                        name="numero_documento"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="direccion">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="correo">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo_electronico"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmarContrasena">
                        Confirmar Contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        name="confirmar_contrasena"
                        required
                    >

                </div>

            </div>


            <button type="submit">
                Registrarse
            </button>

        </form>


        <p>
            ¿Ya tienes una cuenta?
            <a href="login.html">
                Inicia sesión aquí
            </a>
        </p>

    </div>

</body>
</html>
